<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="brand-login">
            <i class="fa-solid fa-boxes-stacked"></i>
            <h1>SIMS</h1>
            <p>Smart Inventory Management System</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
            <p id="error-msg"
                style="color: var(--danger); text-align: center; margin-top: 15px; font-size: 0.9rem; display: none;">
            </p>
        </form>
    </div>
    <script src="app.js"></script>
</body>

</html>
